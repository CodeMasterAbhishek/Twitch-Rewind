<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="../../icons/icon.png" class="logo" alt="Twitch Rewind">
      <h1>Twitch Rewind</h1>
    </div>

    <div class="section">
      <label class="toggle-label">
        <span class="toggle-text">Auto-start on Twitch streams</span>
        <input type="checkbox" id="autoStart" checked>
        <div class="toggle-switch"><div class="toggle-slider"></div></div>
      </label>
      <label class="toggle-label" style="margin-top: 8px;">
        <span class="toggle-text">Automatically unmute streams</span>
        <input type="checkbox" id="autoUnmute">
        <div class="toggle-switch"><div class="toggle-slider"></div></div>
      </label>
    </div>

    <div class="section status-section" id="statusSection">
      <div class="status-header">Current Stream</div>
      <div class="channel-name" id="channelName">Waiting...</div>
      <div class="stream-title" id="streamTitle"></div>
      <div class="rewind-status waiting" id="rewindStatus">Checking status...</div>
    </div>

    <div class="footer">
      <span class="version">v1.0.0</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
