<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="../../icons/icon48.png" class="logo" alt="Twitch Rewind">
      <h1>Twitch Rewind</h1>
    </div>

    <div class="section">
      <label class="toggle-label">
        <span class="toggle-text">Auto-start on Twitch streams</span>
        <input type="checkbox" id="autoStart" checked>
        <div class="toggle-switch"><div class="toggle-slider"></div></div>
      </label>
      <label class="toggle-label" style="margin-top: 8px;">
        <span class="toggle-text">Automatically unmute streams</span>
        <input type="checkbox" id="autoUnmute">
        <div class="toggle-switch"><div class="toggle-slider"></div></div>
      </label>
    </div>

    <div class="section status-section" id="statusSection">
      <div class="status-header">Current Stream</div>
      <div class="channel-name" id="channelName">Waiting...</div>
      <div class="stream-title" id="streamTitle"></div>
      <div class="rewind-status waiting" id="rewindStatus">Checking status...</div>
    </div>

    <!-- Smart Rating System in Popup -->
    <div id="popupRatingSection" style="display: none; margin-top: 15px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 12px 15px; text-align: center;">
      <div style="font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #bf94ff;">Enjoying Twitch Rewind?</div>
      <div style="font-size: 12px; color: #adadb8; margin-bottom: 10px;">Leave a rating to help us grow!</div>
      <div id="popupStars" style="display: flex; justify-content: center; gap: 8px;">
        <span class="p-star" data-val="1" style="font-size: 24px; cursor: pointer; color: #4f4f5a; transition: color 0.2s; line-height: 1;">★</span>
        <span class="p-star" data-val="2" style="font-size: 24px; cursor: pointer; color: #4f4f5a; transition: color 0.2s; line-height: 1;">★</span>
        <span class="p-star" data-val="3" style="font-size: 24px; cursor: pointer; color: #4f4f5a; transition: color 0.2s; line-height: 1;">★</span>
        <span class="p-star" data-val="4" style="font-size: 24px; cursor: pointer; color: #4f4f5a; transition: color 0.2s; line-height: 1;">★</span>
        <span class="p-star" data-val="5" style="font-size: 24px; cursor: pointer; color: #4f4f5a; transition: color 0.2s; line-height: 1;">★</span>
      </div>
    </div>

    <div class="footer">
      <span class="version">v1.0.0</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
